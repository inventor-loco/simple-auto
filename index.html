      saveLang:  function(l){ try { localStorage.setItem('sa-lang', l); } catch(e){} },
      saveLead:  function(email){ try { sessionStorage.setItem('sa-lead', email); } catch(e){} },
      getLead:   function(){ try { return sessionStorage.getItem('sa-lead') || ''; } catch(e){ return ''; } },
      track: function(event, extra) {
        try {
          var d = new FormData();
          d.append('_subject', 'funnel: ' + event);
          d.append('event', event);
          d.append('email', SA.getLead());
          d.append('lang', SA.getLang());
          d.append('ts', new Date().toISOString());
          d.append('page', location.pathname.split('/').pop() || 'index.html');
          if (extra) { for (var k in extra) { if (Object.prototype.hasOwnProperty.call(extra, k)) d.append(k, extra[k]); } }
          fetch(window.SA_LEAD_ENDPOINT, { method: 'POST', body: d, mode: 'no-cors' }).catch(function(){});
        } catch(e) {}
      }
    };
  </script>

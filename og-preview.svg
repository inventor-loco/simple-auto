<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F4F9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8F0FA;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow1" cx="100%" cy="0%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glow2" cx="0%" cy="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative glows -->
  <circle cx="1100" cy="-50" r="300" fill="url(#glow1)"/>
  <circle cx="-50" cy="650" r="250" fill="url(#glow2)"/>

  <!-- Main container -->
  <g transform="translate(600, 315)">
    <!-- Logo text: "simple" in dark, "auto" in blue -->
    <text x="0" y="-40" font-family="'Space Grotesk', sans-serif" font-size="90" font-weight="700" letter-spacing="-2" text-anchor="middle" fill="#0F172A">simple</text>
    <text x="280" y="-40" font-family="'Space Grotesk', sans-serif" font-size="90" font-weight="700" letter-spacing="-2" text-anchor="middle" fill="#1E40AF">auto</text>

    <!-- Accent bar -->
    <rect x="-50" y="20" width="100" height="8" rx="4" fill="#1E40AF"/>

    <!-- Tagline -->
    <text x="0" y="80" font-family="'Sora', sans-serif" font-size="40" font-weight="400" text-anchor="middle" fill="#64748B">Consultores Tecnológicos</text>
  </g>
</svg>

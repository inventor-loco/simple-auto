<!--
  Source for og-cover.jpg, the link-preview card (1200x630).
  og-cover.jpg is what the pages reference; this SVG is the editable original.
  After editing, re-export to og-cover.jpg at 1200x630 and keep it under ~100 KB.
  Note: chat apps cache previews by image URL, so if the design changes
  meaningfully, bump the filename (og-cover-2.jpg) and update the
  og:image / twitter:image tags, or old previews will keep showing.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#0B1526"/>
      <stop offset="55%"  style="stop-color:#0E1E38"/>
      <stop offset="100%" style="stop-color:#0B1526"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%"   style="stop-color:#1E40AF;stop-opacity:0.55"/>
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="0" rx="720" ry="380" fill="url(#glow)"/>

  <g text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <!-- Wordmark -->
    <text x="600" y="270" font-size="112" font-weight="700" letter-spacing="-3">
      <tspan fill="#FFFFFF">simple</tspan><tspan fill="#93C5FD">auto</tspan>
    </text>

    <!-- Accent bar -->
    <rect x="550" y="316" width="100" height="8" rx="4" fill="#93C5FD"/>

    <!-- Tagline -->
    <text x="600" y="416" font-size="52" font-weight="500" fill="#FFFFFF">Business automation</text>

    <!-- Location -->
    <text x="600" y="486" font-size="30" font-weight="400" letter-spacing="4" fill="#93C5FD">LAS PALMAS DE GRAN CANARIA</text>
  </g>
</svg>
